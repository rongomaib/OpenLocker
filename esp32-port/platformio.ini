[env:wt32s3_28s]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; These flags configure PSRAM, LVGL settings, and TFT pins natively 
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    
    ; LVGL Configuration
    -DLV_CONF_SKIP=1
    -DLV_COLOR_DEPTH=16
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_FONT_MONTSERRAT_32=1
    
    ; TFT_eSPI Display Configuration (Typical WT32-S3-28S / SC01 Plus config)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_BL=45
    -DTFT_MISO=-1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=13
    -DTFT_RST=14
    
lib_deps =
    lvgl/lvgl @ ^8.3.7
    bodmer/TFT_eSPI @ ^2.5.31
    tamctec/TAMC_GT911 @ ^1.0.2

